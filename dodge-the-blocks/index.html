<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070812"><title>Dodge the Blocks</title>
<style>
:root{--bg:#070812;--text:#f7f8ff;--muted:#9198b5;--cyan:#35e9ff;--pink:#ff3ea5;--violet:#8d6cff;--green:#4cff9a;--yellow:#ffd84d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
.app{position:relative;width:100%;height:100dvh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 35%,rgba(0,0,0,.55))}
.hud{position:absolute;z-index:3;top:0;left:0;width:100%;padding:18px clamp(14px,3vw,38px);display:flex;justify-content:space-between;gap:15px;pointer-events:none}
.brand{font-size:clamp(18px,2.3vw,27px);font-weight:1000;letter-spacing:-.05em;text-shadow:0 0 20px #35e9ff55}.brand span{color:var(--cyan)}
.stats{display:flex;gap:8px}.stat{min-width:70px;padding:8px 10px;border:1px solid #8b9bff33;border-radius:13px;background:#0d101ec7;backdrop-filter:blur(12px);text-align:center;box-shadow:0 8px 28px #0003}.stat small{display:block;color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.14em}.stat b{display:block;margin-top:2px;font-size:15px;font-variant-numeric:tabular-nums}
.controls{position:absolute;z-index:4;top:18px;right:clamp(14px,3vw,38px);display:flex;gap:7px;pointer-events:auto;transform:translateY(58px)}
.icon{width:42px;height:42px;border:1px solid #8b9bff33;border-radius:12px;background:#0d101ec7;color:#fff;cursor:pointer;backdrop-filter:blur(12px);font-size:17px}
.center{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none}.card{width:min(570px,92vw);padding:34px 26px;text-align:center;pointer-events:auto;border:1px solid #8b9bff33;border-radius:26px;background:#090b16cc;backdrop-filter:blur(18px);box-shadow:0 25px 90px #0007}.hidden{display:none!important}
.kicker{color:var(--cyan);font-size:10px;font-weight:1000;letter-spacing:.24em}.title{margin:8px 0;font-size:clamp(42px,8vw,78px);line-height:.88;letter-spacing:-.075em;font-weight:1000}.title span{color:var(--pink)}.subtitle{margin:0 auto 22px;color:var(--muted);font-size:14px}
.keys{display:flex;justify-content:center;gap:8px;margin:18px 0 25px}.key{min-width:42px;padding:9px 12px;border:1px solid #8b9bff33;border-radius:10px;background:#12162a;color:#cdd3ed;font-size:11px;font-weight:900}
.btn{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,var(--cyan),#6575ff);color:#050712;font-weight:1000;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 35px #35e9ff30}.btn:active{transform:translateY(1px)}
.levelup,.toast{position:absolute;z-index:4;left:50%;top:35%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;text-align:center;font-weight:1000;text-shadow:0 0 25px currentColor}.levelup{font-size:clamp(28px,7vw,65px);color:var(--cyan)}.toast{top:44%;font-size:14px;color:var(--yellow);letter-spacing:.08em}.show{animation:pop .9s ease forwards}
.touch{position:absolute;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}.touch button{pointer-events:auto;width:min(28vw,115px);height:min(18vw,82px);min-height:56px;border:1px solid #8b9bff33;border-radius:18px;background:#0f1324c2;color:#fff;font-size:28px;backdrop-filter:blur(12px)}
.pause{position:absolute;inset:0;z-index:6;background:#04050ccc;backdrop-filter:blur(6px);display:none;place-items:center}.pause.show{display:grid}.pause h2{font-size:clamp(38px,8vw,70px);margin:0 0 22px;letter-spacing:-.07em}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}}
@media(max-width:700px){.hud{padding:12px}.brand{font-size:18px}.stats{gap:4px}.stat{min-width:55px;padding:6px 5px;border-radius:10px}.stat b{font-size:12px}.stat small{font-size:7px}.controls{top:62px;right:12px;transform:none}.touch{display:flex}.card{padding:27px 20px;border-radius:21px}.keys{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style></head><body><div class="app">
<canvas id="c" aria-label="Dodge the Blocks game"></canvas><div class="vignette"></div>
<header class="hud"><div class="brand">DODGE<span>.</span></div><div class="stats">
<div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>LEVEL</small><b id="level">1</b></div><div class="stat"><small>TIME</small><b id="time">0.0s</b></div></div></header>
<div class="controls"><button id="sound" class="icon" aria-label="Toggle sound">🔇</button><button id="pause" class="icon" aria-label="Pause">Ⅱ</button></div>
<div id="start" class="center"><div class="card"><div class="kicker">NEON ARCADE</div><h1 class="title">DODGE<br><span>THE BLOCKS</span></h1><p class="subtitle">Survive. Dodge. Beat your record.</p><div class="keys"><span class="key">←</span><span class="key">→</span><span class="key">A</span><span class="key">D</span></div><button id="play" class="btn">PLAY</button></div></div>
<div id="over" class="center hidden"><div class="card"><div class="kicker">RUN COMPLETE</div><h2 class="title" style="font-size:clamp(40px,7vw,66px)">GAME<br><span>OVER</span></h2><div class="stats" style="justify-content:center;margin:22px 0"><div class="stat"><small>SCORE</small><b id="fs">0</b></div><div class="stat"><small>TIME</small><b id="ft">0.0s</b></div><div class="stat"><small>BEST</small><b id="fb">0</b></div></div><p id="rs" class="subtitle"></p><button id="again" class="btn">PLAY AGAIN</button></div></div>
<div id="lvl" class="levelup">LEVEL UP!</div><div id="toast" class="toast">NEAR MISS!</div>
<div id="pauseVeil" class="pause"><div><h2>PAUSED</h2><button id="resume" class="btn">RESUME</button> <button id="restart" class="btn">RESTART</button></div></div>
<div class="touch"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div>
<script>
(()=>{"use strict";
const c=document.getElementById("c"),x=c.getContext("2d"),$=id=>document.getElementById(id);
const ui={score:$("score"),best:$("best"),level:$("level"),time:$("time"),start:$("start"),over:$("over"),fs:$("fs"),ft:$("ft"),fb:$("fb"),rs:$("rs"),lvl:$("lvl"),toast:$("toast"),pause:$("pauseVeil"),sound:$("sound")};
let W=0,H=0,dpr=1,last=0,audio=null,sound=false,blocks=[],powers=[],parts=[],stars=[];
const s={mode:"ready",t:0,score:0,level:1,spawn:0,near:0,combo:0,maxCombo:0,shield:0,slow:0,boost:0,left:false,right:false,best:Number(localStorage.getItem("dodge-best")||0)};
const p={x:0,y:0,w:26,h:26,vx:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);p.y=H-90;p.x=Math.max(25,Math.min(W-25,p.x||W/2));stars=Array.from({length:Math.max(45,Math.floor(W*H/15000))},()=>({x:Math.random()*W,y:Math.random()*H,z:.5+Math.random()*1.5,a:.15+Math.random()*.4}))}addEventListener("resize",resize);
function beep(f,d=.1,type="sine",v=.035){if(!sound)return;if(!audio)try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{return}if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function mode(m){s.mode=m;ui.start.classList.toggle("hidden",m!=="ready");ui.over.classList.toggle("hidden",m!=="over")}
function reset(){s.t=0;s.score=0;s.level=1;s.spawn=.3;s.near=0;s.combo=0;s.maxCombo=0;s.shield=0;s.slow=0;s.boost=0;blocks=[];powers=[];parts=[];p.x=W/2;p.vx=0;hud()}
function start(){reset();mode("count");let n=3;ui.start.classList.remove("hidden");ui.start.querySelector(".card").innerHTML='<div class="kicker">GET READY</div><div class="title" id="ct">3</div>';let q=setInterval(()=>{n--;if(n>0){$("ct").textContent=n;beep(430,.08)}else{clearInterval(q);ui.start.classList.add("hidden");s.mode="playing";last=performance.now();beep(760,.13)}},600)}
function spawn(){let w=28+Math.random()*72,h=25+Math.random()*72;blocks.push({x:Math.random()*(W-w),y:-h-4,w,h,vy:(190+Math.random()*130)*(1+s.level*.075),col:["#ff3ea5","#35e9ff","#8d6cff","#ffd84d","#ff704d"][Math.floor(Math.random()*5)],near:false})}
function power(){if(Math.random()>.5)return;let a=["shield","slow","boost"],type=a[Math.floor(Math.random()*3)];powers.push({x:22+Math.random()*(W-44),y:-25,size:16,vy:145+s.level*5,type,life:8})}
function level(){let n=1+Math.floor(s.t/12);if(n>s.level){s.level=n;flash(ui.lvl);beep(880,.18,"triangle",.05);for(let i=0;i<24;i++)burst(W/2,H*.38,"#35e9ff",1)}}
function hit(a,b){return Math.abs(a.x-(b.x+b.w/2))<a.w/2+b.w/2&&Math.abs(a.y-(b.y+b.h/2))<a.h/2+b.h/2}
function collect(q){if(q.type==="shield"){s.shield=1;ui.toast.textContent="SHIELD";beep(560,.13,"sine",.05)}else if(q.type==="slow"){s.slow=5;ui.toast.textContent="SLOW TIME";beep(380,.16,"sine",.05)}else{s.boost=6;ui.toast.textContent="SCORE BOOST";beep(920,.13,"triangle",.05)}flash(ui.toast);burst(q.x,q.y,q.type==="shield"?"#4cff9a":q.type==="slow"?"#a987ff":"#ffd84d",14)}
function update(dt){if(s.mode!=="playing")return;s.t+=dt;level();let f=s.slow>0?.55:1;s.slow=Math.max(0,s.slow-dt);s.boost=Math.max(0,s.boost-dt);let dir=(s.right?1:0)-(s.left?1:0);p.vx+=(dir*440-p.vx)*Math.min(1,dt*14);p.x=Math.max(15,Math.min(W-15,p.x+p.vx*dt));s.spawn-=dt;if(s.spawn<=0){spawn();if(Math.random()<.12+s.level*.008)power();s.spawn=Math.max(.28,.85-s.t*.012)}
for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];b.y+=b.vy*dt*f;if(!b.near&&b.y+b.h>p.y-p.h&&b.y<p.y+p.h){let dx=Math.abs(b.x+b.w/2-p.x),gap=b.w/2+p.w/2+18;if(dx<gap&&dx>b.w/2+p.w/2){b.near=true;s.near++;s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo);s.score+=10*Math.max(1,Math.floor(s.combo));ui.toast.textContent=s.combo>1?"NEAR MISS!  x"+Math.floor(s.combo):"NEAR MISS!";flash(ui.toast);beep(700+s.combo*45,.07,"square",.03);burst(p.x,p.y,"#ffd84d",7)}}if(hit(p,b)){if(s.shield){s.shield=0;burst(p.x,p.y,"#4cff9a",22);blocks.splice(i,1);beep(520,.12,"triangle",.05)}else{return gameOver()}}if(b.y>H+100)blocks.splice(i,1)}
for(let i=powers.length-1;i>=0;i--){let q=powers[i];q.y+=q.vy*dt*f;q.life-=dt;if(q.life<=0||q.y>H+40){powers.splice(i,1);continue}if(Math.hypot(q.x-p.x,q.y-p.y)<q.size+p.w/2){collect(q);powers.splice(i,1)}}s.combo=Math.max(0,s.combo-dt*.45);if(Math.random()<dt*18)parts.push({x:p.x+(Math.random()-.5)*18,y:p.y+12,vx:(Math.random()-.5)*20,vy:30+Math.random()*30,life:.3,max:.3,col:"#35e9ff"});for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=55*dt;q.life-=dt;if(q.life<=0)parts.splice(i,1)}hud()}
function gameOver(){s.mode="over";s.score=Math.floor(s.score+s.t*10);if(s.score>s.best){s.best=s.score;localStorage.setItem("dodge-best",s.best)}burst(p.x,p.y,"#ff4f68",42);ui.fs.textContent=s.score;ui.ft.textContent=s.t.toFixed(1)+"s";ui.fb.textContent=s.best;ui.rs.textContent=`Level ${s.level} • ${s.near} near misses • Best combo x${Math.floor(s.maxCombo)}`;ui.over.classList.remove("hidden");ui.pause.classList.remove("show");beep(120,.35,"sawtooth",.06)}
function hud(){ui.score.textContent=Math.floor(s.score);ui.best.textContent=s.best;ui.level.textContent=s.level;ui.time.textContent=s.t.toFixed(1)+"s"}
function burst(a,b,col,n){for(let i=0;i<n;i++){let z=Math.random()*Math.PI*2,v=40+Math.random()*190;parts.push({x:a,y:b,vx:Math.cos(z)*v,vy:Math.sin(z)*v,life:.35+Math.random()*.5,max:.85,col})}}
function flash(el){el.classList.remove("show");void el.offsetWidth;el.classList.add("show")}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#080914");g.addColorStop(.5,"#0a0b18");g.addColorStop(1,"#070812");x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle="#5064b415";let grid=48,off=(s.t*12)%grid;for(let a=-grid;a<W+grid;a+=grid){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let a=-grid+off;a<H+grid;a+=grid){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}stars.forEach(q=>{x.fillStyle=`rgba(150,190,255,${q.a})`;x.fillRect(q.x,q.y,q.z,q.z)});powers.forEach(q=>{x.save();x.translate(q.x,q.y);x.rotate(s.t*2);x.shadowBlur=18;x.shadowColor=q.type==="shield"?"#4cff9a":q.type==="slow"?"#a987ff":"#ffd84d";x.strokeStyle=x.shadowColor;x.lineWidth=3;x.beginPath();x.arc(0,0,q.size,0,Math.PI*2);x.stroke();x.restore()});blocks.forEach(b=>{x.save();x.shadowBlur=18;x.shadowColor=b.col;x.fillStyle=b.col;round(b.x,b.y,b.w,b.h,8);x.fill();x.restore()});x.save();x.translate(p.x,p.y);x.shadowBlur=26;x.shadowColor=s.shield?"#4cff9a":"#35e9ff";x.fillStyle="#eefcff";round(-p.w/2,-p.h/2,p.w,p.h,8);x.fill();x.fillStyle=s.shield?"#4cff9a":"#35e9ff";round(-7,-7,14,14,4);x.fill();x.restore();parts.forEach(q=>{x.globalAlpha=Math.max(0,q.life/q.max);x.fillStyle=q.col;x.fillRect(q.x,q.y,3,3)});x.globalAlpha=1}
function round(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function inp(side,v){s[side]=v}
function toggle(){if(s.mode==="playing"){s.mode="paused";ui.pause.classList.add("show")}else if(s.mode==="paused"){s.mode="playing";ui.pause.classList.remove("show");last=performance.now()}}
addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","a","A","d","D"].includes(e.key)){e.preventDefault();inp(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"?"left":"right",true)}if((e.key===" "||e.key==="p"||e.key==="P")&&!e.repeat){e.preventDefault();toggle()}});addEventListener("keyup",e=>{if(["ArrowLeft","a","A"].includes(e.key))inp("left",false);if(["ArrowRight","d","D"].includes(e.key))inp("right",false)});addEventListener("blur",()=>{s.left=s.right=false;if(s.mode==="playing")toggle()});
["left","right"].forEach(id=>{let b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();inp(id,true)});["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>inp(id,false)))});$("play").onclick=start;$("again").onclick=start;$("pause").onclick=toggle;$("resume").onclick=toggle;$("restart").onclick=start;
ui.sound.onclick=()=>{sound=!sound;ui.sound.textContent=sound?"🔊":"🔇";if(sound)beep(620,.08)};resize();hud();requestAnimationFrame(loop);
})();
</script></div></body></html>
