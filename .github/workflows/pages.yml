name: Verify and deploy portfolio

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/audit/games.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:export
      - run: npm run bundle -w @portfolio/worker
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/out

  deploy:
    # Safe by default: the owner must explicitly configure this repository variable.
    if: github.event_name != 'pull_request' && vars.PORTFOLIO_DEPLOY_BRANCH != '' && github.ref_name == vars.PORTFOLIO_DEPLOY_BRANCH
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy exported static files
        id: deployment
        uses: actions/deploy-pages@v5.0.1
