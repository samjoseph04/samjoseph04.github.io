<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Maze</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><div class="bg"></div><header><div class="brand"><i></i> COLOR MAZE</div><button id="sound">🔊</button></header><section class="hud"><div><span>Level</span><b id="level">1</b></div><div><span>Score</span><b id="score">0</b></div><div><span>Time</span><b id="time">20.0</b></div><div><span>Best</span><b id="best">0</b></div></section><section id="start" class="center"><div class="eyebrow">NAVIGATION CHALLENGE</div><h1>COLOR<br><em>MAZE</em></h1><p>Navigate the changing maze before<br>time runs out.</p><button id="startBtn">START GAME</button><small>ARROWS / WASD • SWIPE • TOUCH</small></section><section id="game" class="game hidden"><div class="mazeHead"><b id="levelText">MAZE 01</b><span id="moves">MOVES 0</span></div><div id="maze" class="maze"></div><div class="mazeFoot"><span id="msg">Reach the glowing exit</span><b id="color">CYAN</b></div><div class="controls"><button data-d="up">▲</button><div><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div></div></section><div id="over" class="modal"><div class="card"><div class="eyebrow">RUN COMPLETE</div><h2 id="title">TIME'S UP</h2><div id="newbest"></div><div class="results"><div><span>Score</span><b id="fs">0</b></div><div><span>Level</span><b id="fl">1</b></div><div><span>Best</span><b id="fb">0</b></div><div><span>Moves</span><b id="fm">0</b></div></div><button id="restartBtn">PLAY AGAIN</button></div></div><div id="flash"></div></main><script src="script.js"></script></body></html>
